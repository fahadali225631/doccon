<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocCon - Free DOCX to PDF Converter</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; margin-top: 20px; box-sizing: border-box; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        p.subtitle { color: #7f8c8d; margin-top: 0; margin-bottom: 25px; }
        .upload-box { border: 2px dashed #3498db; padding: 30px; border-radius: 8px; background-color: #ecf0f1; cursor: pointer; transition: background 0.3s; }
        .upload-box:hover { background-color: #e2e7e9; }
        input[type="file"] { display: none; }
        .btn { display: inline-block; background-color: #2ecc71; color: white; padding: 12px 25px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; }
        .btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        #preview-container { max-width: 600px; width: 100%; background: white; padding: 25px; border-radius: 12px; margin-top: 20px; text-align: left; display: none; box-sizing: border-box; }
        #preview { color: #000; line-height: 1.6; word-wrap: break-word; }
        #preview img { max-width: 100%; height: auto; display: block; margin: 10px auto; }
        .error-text { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>DocCon</h1>
        <p class="subtitle">Convert Word Documents to PDF Instantly</p>
        
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <p id="file-label">Tap to select your .docx file here</p>
            <input type="file" id="fileInput" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
        </div>

        <button class="btn" id="convertBtn" disabled>Download as PDF</button>
    </div>

    <div id="preview-container">
        <h3 style="border-bottom: 2px solid #ecf0f1; padding-bottom: 10px;">Document Layout</h3>
        <div id="preview"></div>
    </div>

    <script>
        let fileData = null;
        let fileName = "converted-document";

        const fileInput = document.getElementById('fileInput');
        const fileLabel = document.getElementById('file-label');
        const convertBtn = document.getElementById('convertBtn');
        const previewContainer = document.getElementById('preview-container');
        const previewElement = document.getElementById('preview');

        // Reset the input so tapping the same file twice doesn't freeze the app
        fileInput.addEventListener('click', function() {
            this.value = null; 
        });

        // Modern file reading using async/await and arrayBuffer (Bypasses mobile memory limits)
        fileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const fileSizeMB = (file.size / 1024 / 1024).toFixed(2);
            fileLabel.innerHTML = `Loading: <b>${file.name}</b> (${fileSizeMB} MB)...`;
            convertBtn.disabled = true;
            
            try {
                // This modern method is much safer for 1MB+ files on mobile
                const buffer = await file.arrayBuffer();
                fileData = buffer;
                fileName = file.name.replace(/\.[^/.]+$/, ""); 
                
                fileLabel.innerHTML = `<span style="color: #2ecc71;">Selected:</span> <b>${file.name}</b>`;
                convertBtn.disabled = false;
            } catch(err) {
                fileLabel.innerHTML = `<span class="error-text">Failed to load file. It might be corrupted or locked by your phone.</span>`;
            }
        });

        convertBtn.addEventListener('click', function() {
            if (!fileData) return;
            
            convertBtn.innerText = "Processing...";
            convertBtn.disabled = true;

            mammoth.convertToHtml({ arrayBuffer: fileData })
                .then(function(result) {
                    previewContainer.style.display = 'block';

                    // If Mammoth outputs nothing, the document is using unsupported complex formatting
                    if (!result.value || result.value.trim() === "") {
                        previewElement.innerHTML = `<p class="error-text">⚠️ Warning: We could not find any standard text in this document. It may contain floating text boxes, complex tables, or unsupported objects resulting in a blank PDF.</p>`;
                    } else {
                        previewElement.innerHTML = result.value;
                    }

                    // Force mobile browser to render images before converting
                    setTimeout(() => {
                        convertBtn.innerText = "Generating PDF...";
                        
                        const opt = {
                            margin:       0.5,
                            filename:     fileName + '.pdf',
                            image:        { type: 'jpeg', quality: 0.98 },
                            html2canvas:  { scale: 2, useCORS: true, windowWidth: 800 }, // windowWidth prevents mobile squishing
                            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
                        };
                        
                        html2pdf().set(opt).from(previewElement).save().then(() => {
                            convertBtn.innerText = "Download as PDF";
                            convertBtn.disabled = false;
                        });
                    }, 500);
                })
                .catch(function(err) {
                    previewContainer.style.display = 'block';
                    previewElement.innerHTML = `<p class="error-text">Error reading document structure.</p>`;
                    convertBtn.innerText = "Download as PDF";
                    convertBtn.disabled = false;
                });
        });
    </script>
</body>
</html>
