<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocCon - Premium Online Word & Image to PDF Converter</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #3b82f6;        /* Blue */
            --primary-hover: #2563eb;  
            --success: #10b981;
            --dark: #ffffff;           /* White Text */
            --text-main: #e2e8f0;      
            --text-muted: #94a3b8;     
            --bg-main: #0f172a;        /* Dark Background */
            --bg-subtle: #1e293b;      
            --border: #334155;         
            --radius-lg: 14px;
            --radius-md: 8px;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .navbar {
            background-color: var(--bg-subtle);
            border-bottom: 1px solid var(--border);
            padding: 18px 24px;
            text-align: center;
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--dark);
        }

        .navbar span {
            color: var(--primary);
        }

        .main-wrapper {
            max-width: 780px;
            margin: 30px auto 60px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .tabs-container {
            display: flex;
            background: var(--bg-main);
            padding: 5px;
            border-radius: var(--radius-lg);
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: var(--radius-md);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--bg-subtle);
            color: var(--primary);
            border: 1px solid var(--border);
        }

        .converter-card {
            background: var(--bg-subtle);
            padding: 40px 30px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            color: var(--dark);
            font-size: 1.75rem;
            margin-top: 0;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .upload-zone {
            border: 2px dashed var(--border);
            padding: 50px 20px;
            border-radius: var(--radius-lg);
            background-color: var(--bg-main);
            cursor: pointer;
        }

        .upload-zone:hover {
            border-color: var(--primary);
        }

        input[type="file"] {
            display: none;
        }

        .gallery-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 12px;
            margin-top: 20px;
            background: var(--bg-main);
            padding: 15px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            max-height: 220px;
            overflow-y: auto;
            display: none; 
        }

        .thumb-wrapper {
            position: relative;
            aspect-ratio: 1;
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .thumb-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn {
            display: block;
            background-color: var(--primary);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 25px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #334155;
            color: #64748b;
            cursor: not-allowed;
        }

        .status-banner {
            margin-top: 20px;
            padding: 16px;
            border-radius: var(--radius-md);
            text-align: left;
        }

        .status-banner.success {
            background-color: #062f22;
            border-left: 4px solid var(--success);
            color: #6ee7b7;
        }

        #preview-container {
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 30px;
            margin-bottom: 40px;
            display: none;
        }

        #preview-container h3 {
            margin-top: 0;
            color: var(--dark);
        }

        #preview-content {
            background: #ffffff;
            color: #000000;
            padding: 0;
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .pdf-image-page-block {
            display: block !important;
            width: 100% !important;
            background: #ffffff !important;
            margin: 0 !important;
            padding: 20px 0 !important;
            text-align: center !important;
            border-bottom: 2px dashed #ccc;
        }

        .pdf-image-page-block img {
            max-width: 100% !important;
            width: auto !important;
            height: auto !important;
            display: inline-block !important;
        }

        .pdf-image-page-block:last-child {
            border-bottom: none;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            margin-top: 80px;
            border-top: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
<div class="navbar">Doc<span>Con</span> Ultimate</div>

    <div class="main-wrapper">
        
        <div class="tabs-container">
            <button class="tab-btn active" id="tab-word" onclick="switchTab('word')">📄 Word to PDF</button>
            <button class="tab-btn" id="tab-image" onclick="switchTab('image')">🖼️ Image to PDF</button>
        </div>

        <div class="converter-card">
            <h1 id="card-title">Convert Word Document to PDF</h1>
            <p class="subtitle" id="card-subtitle">Secure standalone browser rendering engine</p>
            
            <div class="upload-zone" id="dropZone" onclick="triggerFileInput()">
                <span class="upload-icon" id="card-icon" style="font-size:46px;">📝</span>
                <p id="file-label" style="margin: 5px 0 0 0; font-weight: 600;">Tap to upload your document (.docx)</p>
                
                <input type="file" id="wordInput" accept=".docx">
                <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" multiple>
            </div>

            <div class="gallery-preview" id="imagePreviewGrid"></div>
            <div id="statusBox"></div>
            <button class="btn" id="convertBtn" disabled>Download as PDF</button>
        </div>

        <div id="preview-container">
            <h3>✨ Live Structural Document Viewport Canvas</h3>
            <div id="preview-content"></div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 DocCon Platform Infrastructure. All rights reserved.</p>
    </footer>

    <script>
        let currentMode = 'word'; 
        let cachedWordBuffer = null;
        let cachedWordName = "document-output";
        let cachedImageArray = []; 

        const wordInput = document.getElementById('wordInput');
        const imageInput = document.getElementById('imageInput');
        const fileLabel = document.getElementById('file-label');
        const convertBtn = document.getElementById('convertBtn');
        const statusBox = document.getElementById('statusBox');
        const imagePreviewGrid = document.getElementById('imagePreviewGrid');
        const previewContainer = document.getElementById('preview-container');
        const previewContent = document.getElementById('preview-content');

        function switchTab(mode) {
            if (currentMode === mode) return;
            currentMode = mode;
            resetWorkspace();

            document.getElementById('tab-word').classList.toggle('active', mode === 'word');
            document.getElementById('tab-image').classList.toggle('active', mode === 'image');

            if (mode === 'word') {
                document.getElementById('card-title').innerText = "Convert Word Document to PDF";
                document.getElementById('card-subtitle').innerText = "Secure standalone browser rendering engine";
                document.getElementById('card-icon').innerText = "📝";
                fileLabel.innerHTML = "Tap to upload your document (.docx)";
                imagePreviewGrid.style.display = "none";
            } else {
                document.getElementById('card-title').innerText = "Convert Images to PDF Book";
                document.getElementById('card-subtitle').innerText = "Convert wide or tall images without splitting pages";
                document.getElementById('card-icon').innerText = "🖼️";
                fileLabel.innerHTML = "Tap to upload image files (JPG, PNG, WebP)";
                imagePreviewGrid.style.display = "grid";
            }
        }

        function triggerFileInput() {
            if (currentMode === 'word') { wordInput.click(); } else { imageInput.click(); }
        }

        function resetWorkspace() {
            wordInput.value = null; imageInput.value = null;
            cachedWordBuffer = null; cachedImageArray = [];
            statusBox.innerHTML = ''; imagePreviewGrid.innerHTML = '';
            previewContent.innerHTML = ''; previewContainer.style.display = 'none';
            convertBtn.disabled = true; convertBtn.innerText = "Download as PDF";
        }

        // WORD TO PDF CONVERSION PIPELINE
        wordInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            fileLabel.innerHTML = `Analyzing: <b>${file.name}</b>...`;
            try {
                cachedWordBuffer = await file.arrayBuffer();
                cachedWordName = file.name.replace(/\.[^/.]+$/, "");
                
                mammoth.convertToHtml({ arrayBuffer: cachedWordBuffer })
                    .then(function(result) {
                        previewContent.innerHTML = `<div style="padding: 20px;">${result.value}</div>`;
                        previewContainer.style.display = 'block';
                        statusBox.innerHTML = `<div class="status-banner success"><b>✓ Ready:</b> Document parsed completely.</div>`;
                        convertBtn.disabled = false;
                    });
            } catch (err) {
                fileLabel.innerHTML = "Error rendering file.";
            }
        });

        // IMAGE TO PDF CONVERSION PIPELINE
        imageInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            fileLabel.innerHTML = `Formatting <b>${files.length}</b> Images...`;
            imagePreviewGrid.innerHTML = '';
            previewContent.innerHTML = '';
            cachedImageArray = [];

            let processedCount = 0;

            files.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64Data = event.target.result;
                    cachedImageArray.push({ data: base64Data, type: file.type });

                    // Add dashboard UI previews
                    const thumb = document.createElement('div');
                    thumb.className = 'thumb-wrapper';
                    thumb.innerHTML = `<img src="${base64Data}">`;
                    imagePreviewGrid.appendChild(thumb);

                    // Add visual document viewport previews
                    const pageBlock = document.createElement('div');
                    pageBlock.className = 'pdf-image-page-block';
                    pageBlock.innerHTML = `<img src="${base64Data}">`;
                    previewContent.appendChild(pageBlock);

                    processedCount++;
                    if (processedCount === files.length) {
                        previewContainer.style.display = 'block';
                        fileLabel.innerHTML = `Selected: <b>${files.length} Images Loaded</b>`;
                        statusBox.innerHTML = `<div class="status-banner success"><b>✓ Verified:</b> Ready to convert to exact sizing.</div>`;
                        convertBtn.disabled = false;
                    }
                };
                reader.readAsDataURL(file);
            });
        });

        // GENERATION TRIGGER ENGINE (FIXED)
        convertBtn.addEventListener('click', async function() {
            convertBtn.disabled = true;
            convertBtn.innerText = "Building PDF File...";

            if (currentMode === 'word') {
                // Keep existing Word-to-PDF logic
                const opt = {
                    margin:       0.4,
                    filename:     cachedWordName + '.pdf',
                    image:        { type: 'jpeg', quality: 1.0 },
                    html2canvas:  { scale: 2, useCORS: true, logging: false },
                    jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' },
                    pagebreak:    { mode: ['css', 'legacy'] }
                };

                html2pdf().set(opt).from(previewContent).save().then(() => {
                    convertBtn.innerText = "Download as PDF";
                    convertBtn.disabled = false;
                }).catch(() => {
                    convertBtn.innerText = "Download as PDF";
                    convertBtn.disabled = false;
                });
            } else {
                // New Image-to-PDF Logic (Calculates exact image sizing)
                try {
                    const { jsPDF } = window.jspdf;
                    let pdf = null;

                    for (let i = 0; i < cachedImageArray.length; i++) {
                        const imageData = cachedImageArray[i];
                        
                        // Parse format
                        let format = 'JPEG';
                        if (imageData.type === 'image/png') format = 'PNG';
                        else if (imageData.type === 'image/webp') format = 'WEBP';

                        // Calculate native image dimensions
                        const img = new Image();
                        img.src = imageData.data;
                        await new Promise(resolve => img.onload = resolve);

                        const width = img.naturalWidth;
                        const height = img.naturalHeight;
                        const orientation = width > height ? 'l' : 'p';

                        // Create page specifically tailored to the image dimensions
                        if (i === 0) {
                            pdf = new jsPDF({
                                orientation: orientation,
                                unit: 'px',
                                format: [width, height]
                            });
                        } else {
                            pdf.addPage([width, height], orientation);
                        }

                        // Stretch the image perfectly edge-to-edge
                        pdf.addImage(imageData.data, format, 0, 0, width, height);
                    }

                    pdf.save("image-compilation-output.pdf");
                    
                    convertBtn.innerText = "Download as PDF";
                    convertBtn.disabled = false;
                } catch (err) {
                    console.error(err);
                    convertBtn.innerText = "Error - Try Again";
                    convertBtn.disabled = false;
                }
            }
        });
    </script>
</body>
</html>
