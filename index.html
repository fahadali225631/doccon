<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocCon - Free DOCX to PDF Converter</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            margin-top: 40px;
            box-sizing: border-box;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        p.subtitle { color: #7f8c8d; margin-top: 0; margin-bottom: 25px; }
        
        .upload-box {
            border: 2px dashed #3498db;
            padding: 30px;
            border-radius: 8px;
            background-color: #ecf0f1;
            cursor: pointer;
            transition: background 0.3s;
        }
        .upload-box:hover { background-color: #e2e7e9; }
        input[type="file"] { display: none; }
        
        .btn {
            display: inline-block;
            background-color: #2ecc71;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        
        #preview-container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 20px;
            text-align: left;
            display: none;
            box-sizing: border-box;
        }
        #preview-container h3 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        #preview {
            background: white;
            color: #000000;
            line-height: 1.6;
            word-wrap: break-word;
        }
        #preview img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DocCon</h1>
        <p class="subtitle">Convert Word Documents to PDF Instantly & Privately</p>
        
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <p id="file-label">Tap to select or drop your .docx file here</p>
            <input type="file" id="fileInput" accept=".docx,.DOCX,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
        </div>

        <button class="btn" id="convertBtn" disabled>Download as PDF</button>
    </div>

    <div id="preview-container">
        <h3>Document Preview</h3>
        <div id="preview"></div>
    </div>

    <script>
        let fileData = null;
        let fileName = "converted-document";

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            // FIX 1: Instantly update the text on screen so you know the app received the file
            const fileSizeMB = (file.size / 1024 / 1024).toFixed(2);
            document.getElementById('file-label').innerText = "Loading: " + file.name + " (" + fileSizeMB + " MB)";
            
            fileName = file.name.replace(/\.[^/.]+$/, ""); 
            
            const reader = new FileReader();
            
            reader.onload = function(event) {
                fileData = event.target.result;
                document.getElementById('file-label').innerText = "Selected: " + file.name;
                document.getElementById('convertBtn').disabled = false;
            };
            
            // FIX 2: Catch if your phone blocks the file stream and tell you how to bypass it
            reader.onerror = function() {
                alert("Mobile Security Alert: Your phone is blocking access to this file because it is sitting in your cloud storage (iCloud/Drive). \n\nTo fix this: Open your phone's 'Files' app, copy the document, and paste it directly into your local 'Downloads' folder, then select it from there!");
                document.getElementById('file-label').innerText = "Tap to select or drop your .docx file here";
            };
            
            try {
                reader.readAsArrayBuffer(file);
            } catch(err) {
                alert("Reader crash: " + err.message);
            }
        });

        document.getElementById('convertBtn').addEventListener('click', function() {
            if (!fileData) return;
            
            const convertBtn = document.getElementById('convertBtn');
            convertBtn.innerText = "Processing Images...";
            convertBtn.disabled = true;

            mammoth.convertToHtml({ arrayBuffer: fileData })
                .then(function(result) {
                    const previewContainer = document.getElementById('preview-container');
                    const previewElement = document.getElementById('preview');
                    
                    previewElement.innerHTML = result.value;
                    previewContainer.style.display = 'block';

                    const images = previewElement.querySelectorAll('img');
                    const imagePromises = Array.from(images).map(img => {
                        if (img.complete) return Promise.resolve();
                        return new Promise(resolve => {
                            img.onload = resolve;
                            img.onerror = resolve;
                        });
                    });

                    Promise.all(imagePromises).then(() => {
                        convertBtn.innerText = "Generating PDF...";
                        
                        setTimeout(() => {
                            const opt = {
                                margin:       0.5,
                                filename:     fileName + '.pdf',
                                image:        { type: 'jpeg', quality: 0.95 },
                                html2canvas:  { scale: 1.5, useCORS: true, logging: false },
                                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' },
                                pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
                            };
                            
                            html2pdf().set(opt).from(previewElement).save().then(() => {
                                convertBtn.innerText = "Download as PDF";
                                convertBtn.disabled = false;
                            });
                        }, 400);
                    });
                })
                .catch(function(err) {
                    alert("Error parsing layout.");
                    convertBtn.innerText = "Download as PDF";
                    convertBtn.disabled = false;
                });
        });
    </script>

</body>
</html>
